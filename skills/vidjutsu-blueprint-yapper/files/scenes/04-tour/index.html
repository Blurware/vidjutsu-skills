<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit/yap.css">
<link rel="stylesheet" href="kit/shots.css">
</head><body>
<script src="kit/yap.js"></script>
<script src="kit/shots.js"></script>
<script>
// Beat: TOUR (split). One of the repo's own demo clips per thing named, each with its real command typing, sliding in from alternate sides.
// Times are seconds inside this scene. Images (img/) are the sample's own
// captures: replace each with your capture of your resource (capture_page.mjs,
// make_sheet.py) and move rects and camera points to its pixels. Captions come
// from the post-cut words: [start, end, text], 1 to 3 words, *word* = flair.
// On a split beat add pop: {fps: 30, frames} once its pop.mov is in the folder.
Yap.scene({
  "layout": "split",
  "cards": [
    {"type": "demo", "at": 0, "until": 0.953, "y": -77, "scale": 1, "popFrom": 1, "name": "cut.py", "sheet": "img/cut_smart.jpg", "cols": 4, "rows": 4, "frames": 16, "fw": 980, "fh": 278, "fps": 12, "cmd": "cut.py --start 1.3 --end 6.6 --smart", "dir": 1},
    {"type": "demo", "at": 0.853, "until": 1.789, "y": -77, "scale": 1, "popFrom": 1, "name": "caption.py", "sheet": "img/captions_pop_karaoke.jpg", "cols": 4, "rows": 4, "frames": 16, "fw": 980, "fh": 278, "fps": 12, "cmd": "caption.py --animate pop --karaoke", "dir": -1},
    {"type": "demo", "at": 1.689, "until": 2.876, "y": -77, "scale": 1, "popFrom": 1, "name": "fit.py", "sheet": "img/reframe_crop.jpg", "cols": 4, "rows": 4, "frames": 16, "fw": 980, "fh": 278, "fps": 12, "cmd": "fit.py --aspect 9:16 --fit crop", "dir": 1},
    {"type": "demo", "at": 2.776, "until": 3.996, "y": -77, "scale": 1, "popFrom": 1, "name": "silence.py", "sheet": "img/silence_removal.jpg", "cols": 4, "rows": 4, "frames": 16, "fw": 980, "fh": 278, "fps": 12, "cmd": "silence.py --threshold -35", "dir": -1},
    {"type": "demo", "at": 3.896, "until": 9, "y": -77, "scale": 1, "popFrom": 1, "name": "loudness.py", "sheet": "img/loudness.jpg", "cols": 4, "rows": 4, "frames": 16, "fw": 980, "fh": 278, "fps": 12, "cmd": "loudness.py -I -14 --tp -1", "dir": 1}
  ],
  "captions": [
    [0.07, 0.85, "It cuts clips"],
    [1.01, 1.75, "adds *captions*"],
    [1.87, 2.29, "reframes"],
    [2.33, 2.85, "for *vertical*"],
    [3.01, 3.35, "strips out"],
    [3.37, 3.97, "the *silences*"],
    [4.03, 4.45, "and fixes"],
    [4.49, 5.03, "the *loudness*"]
  ],
  "seconds": 5.1
});
Yap.shots();
</script>
</body></html>
