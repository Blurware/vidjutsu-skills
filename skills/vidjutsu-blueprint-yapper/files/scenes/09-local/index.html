<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit/yap.css">
<link rel="stylesheet" href="kit/shots.css">
</head><body>
<script src="kit/yap.js"></script>
<script src="kit/shots.js"></script>
<script>
// Beat: LOCAL / FREE (card). The page's no-keys lines, the camera pushing in close and a marker on each as it's said.
// Times are seconds inside this scene. Images (img/) are the sample's own
// captures: replace each with your capture of your resource (capture_page.mjs,
// make_sheet.py) and move rects and camera points to its pixels. Captions come
// from the post-cut words: [start, end, text], 1 to 3 words, *word* = flair.
// On a split beat add pop: {fps: 30, frames} once its pop.mov is in the folder.
Yap.scene({
  "layout": "card",
  "cards": [
    {
      "type": "page",
      "at": 0,
      "img": "img/page.png",
      "iw": 1080,
      "ih": 4800,
      "w": 1000,
      "h": 1130,
      "y": -40,
      "scale": 0.7692307692307692,
      "popFrom": 1,
      "url": "github.com/kajisho5/ffmpeg-skill",
      "life": 3.7,
      "tilt": {"rot": 3, "dur": 0.378},
      "cam": [
        {"at": 0, "cx": 540, "cy": 3330, "z": 0.926},
        {"at": 0.42, "cx": 420, "cy": 3300, "z": 1.7, "dur": 0.378},
        {"at": 1.598, "cx": 300, "cy": 3345, "z": 2.3, "dur": 0.336},
        {"at": 2.523, "cx": 430, "cy": 3345, "z": 2.3, "dur": 0.294}
      ],
      "marks": [
        {"at": 0.824, "rect": [269, 3276, 194, 36]},
        {"at": 1.934, "rect": [194, 3324, 130, 36]},
        {"at": 2.825, "rect": [349, 3324, 172, 36]}
      ]
    }
  ],
  "captions": [
    [0.08, 0.46, "and it all"],
    [0.52, 1.06, "runs on your"],
    [1.1, 1.5, "*computer*"],
    [1.66, 2.4, "No uploads"],
    [2.56, 3.62, "no API *keys*"]
  ],
  "seconds": 3.7
});
Yap.shots();
</script>
</body></html>
