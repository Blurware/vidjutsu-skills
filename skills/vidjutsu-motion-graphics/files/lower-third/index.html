<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* ---- LOOK: the style. vidjutsu-style writes these; change them together
     in every scene so the cards match. */
  :root {
    --font: "Inter", "Helvetica Neue", Arial, sans-serif;
    --bg: #0b0b0b;          /* title card background */
    --bg-glow: #161616;     /* the soft light behind the title */
    --text: #f5f5f5;        /* titles and names */
    --muted: #a3a3a3;       /* subtitles and roles */
    --accent: #8a8a8a;      /* the kicker above the title */
    --panel: rgba(14,14,14,0.94);       /* the lower third's box */
    --panel-edge: rgba(255,255,255,0.08);
    --radius: 12px;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #404040; }
  body { font-family: var(--font); }
  /* The picture behind the lower third: your footage when FOOTAGE_FPS is
     set (see below), otherwise a plain backdrop. */
  #plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #backdrop { position: absolute; inset: 0; background: linear-gradient(160deg, #525252 0%, #262626 100%); }
  /* A near-solid panel with a hairline edge: it reads over dark, light and
     busy footage alike. (Frosted glass needs backdrop-filter blur, the
     slowest thing a page can draw, so it is left out.) Over footage that has
     its own captions, move it with left and bottom. */
  #box { position: absolute; left: 160px; bottom: 128px; border-radius: var(--radius); overflow: hidden;
         padding: 20px 32px 24px; background: var(--panel);
         border: 1px solid var(--panel-edge); }
  /* Every element render(t) moves or fades keeps its own layer from the first
     frame, so its text is drawn the same whatever frame came before. */
  #box, #role { will-change: transform, opacity; }
  #who { font-size: 56px; font-weight: 700; letter-spacing: -0.022em; color: var(--text); line-height: 1.1; white-space: nowrap; }
  #role { font-size: 28px; font-weight: 500; color: var(--muted); margin-top: 6px; white-space: nowrap; }
</style>
</head>
<body>
<img id="plate" alt="">
<div id="backdrop"></div>
<div id="box"><div id="who"></div><div id="role"></div></div>
<script>
  // ---- Change these.
  const CONTENT = { name: "Max Jean", role: "Host, The Max Jean Show" };
  const SECONDS = 6;        // match "seconds" for this scene in film.json
  // Footage behind the lower third. 0 draws a plain backdrop. To draw over a
  // take, put take.mp4 in this folder, add to this scene in film.json
  //   "extract": [{"video": "take.mp4", "frames": "f/%04d.jpg", "fps": 30}]
  // and set FOOTAGE_FPS to that fps.
  const FOOTAGE_FPS = 0;

  const clamp = (v) => Math.min(1, Math.max(0, v));
  const span = (t, from, to) => clamp((t - from) / (to - from));
  const outQuint = (p) => 1 - Math.pow(1 - p, 5);
  const inCubic = (p) => p * p * p;

  // ---- Build once.
  const plate = document.getElementById("plate");
  const box = document.getElementById("box");
  const who = document.getElementById("who");
  const role = document.getElementById("role");
  who.textContent = CONTENT.name;
  role.textContent = CONTENT.role;
  if (FOOTAGE_FPS > 0) {
    plate.style.display = "block";
    document.getElementById("backdrop").style.display = "none";
  }

  // ---- Draw time t. render(t) may be async: the frame is taken once it
  // settles, so a still can finish loading first.
  // In: the panel wipes open over the name, then the role rises.
  // Out: the panel wipes shut, taking the text with it, by SECONDS - 0.1.
  window.render = async (t) => {
    if (FOOTAGE_FPS > 0) {
      const n = Math.floor(t * FOOTAGE_FPS + 1e-6) + 1;
      const src = `f/${String(n).padStart(4, "0")}.jpg`;
      if (plate.getAttribute("src") !== src) {
        await new Promise((loaded, failed) => {
          plate.onload = loaded;
          plate.onerror = () => failed(new Error("missing still " + src));
          plate.setAttribute("src", src);
        });
      }
    }
    const inBox = outQuint(span(t, 0.2, 0.9));
    const inRole = outQuint(span(t, 0.45, 1.05));
    const outBox = inCubic(span(t, SECONDS - 0.45, SECONDS - 0.1));

    // Fully open, drop the clip: an inset of 0% can draw its edge a shade
    // differently depending on the frame before, and frames must repeat exactly.
    const open = inBox - outBox;
    box.style.clipPath = open >= 1 ? "none" : `inset(0 ${(1 - open) * 100}% 0 0 round var(--radius))`;
    role.style.opacity = inRole;
    role.style.transform = `translateY(${(1 - inRole) * 10}px)`;
  };
  window.render(0);
</script>
</body>
</html>
